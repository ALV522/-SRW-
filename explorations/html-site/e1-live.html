const setApiState=(text,cls='')=>{const e=document.querySelector('#api-state');e.textContent=text;e.className='badge '+cls};

async function getJson(path){
 if(!path.startsWith('/')) throw new Error('E1 only permits same-origin absolute paths');
 const response=await fetch(path,{method:'GET',headers:{Accept:'application/json'},cache:'no-store'});
 if(!response.ok) throw new Error('GET '+path+' → HTTP '+response.status);
 const ct=response.headers.get('content-type')||'';
 if(!ct.includes('json')) throw new Error('Expected JSON from '+path);
 return response.json();
}

async function loadLive(){
 if(location.protocol==='file:') {
  state.liveError='直接打开 HTML 文件不会连接真实数据；请通过只读 bridge 打开。';
  return false;
 }
 try{
  const [ready,info,runtime,dashboard,projects]=await Promise.all([
   getJson('/health/ready'),
   getJson('/api/v1/info'),
   getJson('/api/v1/runtime/info'),
   getJson('/api/v1/dashboard'),
   getJson('/api/v1/projects')
  ]);
  if(ready.status!=='ready'||info.product!=='SRW'||runtime.product!=='SRW') {
   throw new Error('连接的不是就绪的 SRW 后端');
  }
  if(info.instance_id!==runtime.instanceId||info.data_dir_identity!==runtime.dataScopeId) {
   throw new Error('SRW 实例身份不一致，拒绝混用数据源');
  }
  state.dashboard=dashboard;
  state.projects=projects.projects||[];
  state.serviceInfo=info;
  state.runtimeInfo=runtime;
  state.liveError='';
  state.mode='live';
  setApiState('LIVE · '+String(runtime.edition||'web')+' · GET-only','live');
  return true;
 }catch(err){
  state.liveError=String(err.message||err);
  console.warn('E1 live adapter fallback:',err);
  return false;
 }
}

function queuePanel(title,note,items){
 return '<section class="panel"><div class="ph"><div><h2>'+esc(title)+'</h2><div class="muted tiny">'+esc(note)+'</div></div></div><div class="pb"><div class="list">'+
 (items?.length?items.map(x=>{
  const canCandidate=Boolean(x.candidate_id);
  const target=canCandidate?`openCandidate('${esc(x.candidate_id)}','${esc(x.project_id||'')}')`:`openProject('${esc(x.project_id||'')}')`;
  return '<div class="item"><div><div class="item-title">'+esc((x.candidate_name?x.candidate_name+' · ':'')+(x.title||x.project_title||x.action_type||'待处理'))+'</div><div class="item-note">'+esc([x.project_title,x.reason,x.detail].filter(Boolean).join(' · '))+'</div></div><button class="btn primary small" onclick="'+target+'">查看</button></div>';
 }).join(''):'<div class="empty">当前没有待处理事项</div>')+
 '</div></div></section>';
}

// E1 has project-scoped candidate APIs but no global candidate directory API.
// Build a BOUNDED read-only cross-project directory, with explicit truncation.
async function loadCandidateDirectory(){
 const rows=[];
 const projects=state.projects.filter(p=>p.status!=='archived');
 const totalExpected=projects.reduce((sum,p)=>sum+Number(p.candidate_count||0),0);
 let truncated=false;
 for(const p of projects){
  const count=Number(p.candidate_count||0);
  let offset=0;
  while(offset<count){
   const limit=Math.min(100,500-rows.length);
   if(limit<=0){truncated=true;break;}
   const data=await getJson('/api/v1/projects/'+encodeURIComponent(p.project_id)+'/candidates?archived=active&limit='+limit+'&offset='+offset);
   const batch=data.candidates||[];
   rows.push(...batch.map(c=>({...c,project_id:p.project_id,project_title:p.title})));
   offset+=batch.length;
   if(!batch.length)break;
  }
  if(rows.length>=500){truncated=rows.length<totalExpected;break;}
 }
 return {rows,totalExpected,truncated};
}

function renderCandidateDirectory(){
 const data=state.candidateDirectory||{rows:[],totalExpected:0,truncated:false};
 root.innerHTML='<div class="hero"><div><h1>候选人</h1><div class="muted">基于项目真实接口聚合的只读候选人目录；候选人始终保有项目上下文。</div></div><button class="btn" id="dir-refresh">刷新目录</button></div>'+
 (data.truncated?'<div class="notice warn">数据量较大：这里只加载前 500 人，不能当作完整候选人名单。请打开具体项目查看其它候选人。</div>':'')+
 '<section class="panel"><div class="ph"><div><h2>跨项目候选人</h2><div class="muted tiny">已读取 '+fmt(data.rows.length)+' 人'+(data.truncated?'（总量约 '+fmt(data.totalExpected)+' 人）':'')+'</div></div></div><div class="pb">'+
 '<div class="actions" style="margin-bottom:14px"><input class="btn" style="min-width:230px;text-align:left" id="dir-search" placeholder="搜索姓名或项目"><select class="btn" id="dir-stage"><option value="">全部阶段</option>'+
 Object.entries(stageLabels).map(([k,v])=>'<option value="'+esc(k)+'">'+esc(v)+'</option>').join('')+
 '</select><span class="muted tiny" id="dir-count"></span></div><div id="dir-results"></div></div></section>';
 document.querySelector('#dir-search').addEventListener('input',filterCandidateDirectory);
 document.querySelector('#dir-stage').addEventListener('change',filterCandidateDirectory);
 document.querySelector('#dir-refresh').addEventListener('click',()=>candidatesPage(true));
 filterCandidateDirectory();
 activate('candidates');
}

function filterCandidateDirectory(){
 const data=state.candidateDirectory||{rows:[]};
 const q=(document.querySelector('#dir-search')?.value||'').trim().toLocaleLowerCase();
 const stageFilter=document.querySelector('#dir-stage')?.value||'';
 const rows=data.rows.filter(x=>(!q||(String(x.display_name||'')+' '+String(x.project_title||'')).toLocaleLowerCase().includes(q))&&(!stageFilter||x.pipeline_stage===stageFilter));
 document.querySelector('#dir-count').textContent='当前显示 '+fmt(rows.length)+' 人';
 document.querySelector('#dir-results').innerHTML=candidateTable(rows,true);
}
