name: SRW Repository Integrity
on:
  push:
    branches: [main, "repair/**", "dev/**", "integration/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current source and retained historical inventory
        run: python scripts/check_source_integrity.py
      - name: Verify release identity
        run: python scripts/check_release_truth.py
