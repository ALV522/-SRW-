name: SRW Windows Native Host Source Sandbox

on:
  push:
    branches: [explore/html-site-prototype]
    paths:
      - .github/workflows/native-host-sandbox.yml
      - explorations/html-site/assemble_native_lab.py
      - explorations/html-site/run_native_lab.py
      - explorations/html-site/prepare_native_host_lab.py
      - desktop/**
      - global.json
  workflow_dispatch:

concurrency:
  group: srw-wpf-source-only-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wpf-source-only:
    name: WPF/WebView2 C11 host source build (NOT Portable)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install exact reviewed .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Verify exact .NET version
        shell: pwsh
        run: |
          $sdk = (dotnet --version).Trim()
          if ($sdk -ne '10.0.302') { throw "Exact reviewed .NET SDK not installed: $sdk" }
          dotnet --info
      - name: Restore NuGet dependencies from existing locked graph
        shell: pwsh
        run: |
          dotnet restore desktop/SRW.Desktop/SRW.Desktop.csproj --locked-mode -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Locked WPF NuGet restore failed' }
      - name: Build current C11 Windows host source
        shell: pwsh
        run: |
          dotnet build desktop/SRW.Desktop/SRW.Desktop.csproj -c Release -r win-x64 --no-restore --nologo -p:ContinuousIntegrationBuild=true -p:SelfContained=false -o artifacts/wpf-host-only
          if ($LASTEXITCODE -ne 0) { throw 'WPF host source compile failed' }
      - name: Verify host-only outputs and record provenance
        shell: pwsh
        run: |
          $target = 'artifacts/wpf-host-only/SmartRecruitmentWorkbench.exe'
          if (!(Test-Path -LiteralPath $target -PathType Leaf)) { throw "WPF executable missing after build" }
          $version = (Get-Content -Raw -LiteralPath VERSION).Trim()
          $items = @(Get-ChildItem -LiteralPath artifacts/wpf-host-only -File | ForEach-Object {
            [ordered]@{ file = $_.Name; bytes = $_.Length; sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() }
          })
          $truth = [ordered]@{
            schema = 'srw.exploration.wpf-host-only.v1'
            source_sha = $env:GITHUB_SHA
            source_branch = $env:GITHUB_REF_NAME
            version = $version
            sdk = (dotnet --version).Trim()
            target = 'net10.0-windows/win-x64'
            artifact_kind = 'HOST_BINARY_ONLY'
            portable = $false
            native_gui_accepted = $false
            runtime_included = $false
            production_knowledge_included = $false
            claim_boundary = 'WPF/WebView2 source compilation only. No embedded Python, SRW Core/Knowledge, GUI smoke or portable release verification.'
            outputs = $items
          }
          $truth | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath artifacts/wpf-host-only/WPF_HOST_SOURCE_BUILD_TRUTH.json -Encoding UTF8
          Write-Host "SOURCE HOST COMPILE PASS; not a runnable SRW Portable product"
      - name: Upload isolated host-only source build
        uses: actions/upload-artifact@v4
        with:
          name: SRW-C11-WPF-HOST-ONLY-NOT-PORTABLE-${{ github.sha }}
          path: artifacts/wpf-host-only/
          if-no-files-found: error
          retention-days: 14

  native-source-lab:
    name: C11 WPF + temporary Python + shared Web E1 (synthetic only)
    needs: wpf-source-only
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use exact pinned .NET 10 SDK for independent Source Lab adaptation
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Copy and strictly adapt WPF host sources for an external venv Python
        shell: pwsh
        run: |
          python explorations/html-site/prepare_native_host_lab.py --output artifacts/native-lab-desktop-src
          if ($LASTEXITCODE -ne 0) { throw "Strict isolated C# patch failed" }
      - name: Compile distinctly labeled LAB host (production C# source remains unchanged)
        shell: pwsh
        run: |
          dotnet restore artifacts/native-lab-desktop-src/SRW.Desktop.csproj --locked-mode -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "Lab host locked restore failed" }
          dotnet build artifacts/native-lab-desktop-src/SRW.Desktop.csproj -c Release -r win-x64 --no-restore --nologo -p:ContinuousIntegrationBuild=true -p:SelfContained=false -o artifacts/native-lab-host-only
          if ($LASTEXITCODE -ne 0) { throw "LAB host compile failed" }
          $exe = 'artifacts/native-lab-host-only/SmartRecruitmentWorkbench.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Lab WPF executable missing' }
          $patch = 'artifacts/native-lab-desktop-src/NATIVE_LAB_CSHARP_PATCH.json'
          Copy-Item -LiteralPath $patch -Destination artifacts/native-lab-host-only/NATIVE_LAB_CSHARP_PATCH.json
          $outputs = @(Get-ChildItem -LiteralPath artifacts/native-lab-host-only -File |
            Where-Object { $_.Name -ne 'NATIVE_LAB_CSHARP_PATCH.json' } |
            ForEach-Object {
              [ordered]@{
                file = $_.Name
                sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              }
            })
          $truth = [ordered]@{
            artifact_kind = 'SOURCE_LAB_HOST_MODIFIED'
            source_sha = $env:GITHUB_SHA
            source_modified = $true
            production_source_modified = $false
            release_approved = $false
            native_gui_accepted = $false
            python_executable = 'runtime/Scripts/python.exe'
            source_patch_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $patch).Hash.ToLowerInvariant()
            outputs = $outputs
            claim_boundary = 'Experimental WPF host built from an isolated copied source with explicit virtualenv Python path adaptation; not canonical Native.'
          }
          $truth | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath artifacts/native-lab-host-only/WPF_HOST_SOURCE_BUILD_TRUTH.json -Encoding UTF8
      - name: Assemble Native SOURCE preview and verify every staged file
        shell: pwsh
        run: |
          python explorations/html-site/assemble_native_lab.py --output artifacts/native-source-lab --host-dir artifacts/native-lab-host-only
          if ($LASTEXITCODE -ne 0) { throw "Native lab assembly failed" }
          python explorations/html-site/assemble_native_lab.py --verify artifacts/native-source-lab
          if ($LASTEXITCODE -ne 0) { throw "Native lab file hash audit failed" }
      - name: Exercise real WPF host + C11 backend + E1 read-only Web
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python artifacts/native-source-lab/run_native_lab.py --smoke --strict-gui
          if ($LASTEXITCODE -ne 0) { throw "Windows Native GUI/real backend acceptance did not pass" }
      - name: Publish explicitly synthetic Native SOURCE preview
        uses: actions/upload-artifact@v4
        with:
          name: SRW-C11-WPF-SOURCE-SYNTHETIC-PREVIEW-NOT-PORTABLE-${{ github.sha }}
          path: artifacts/native-source-lab/
          if-no-files-found: error
          retention-days: 14
