# Runs ONLY trusted default-branch reporter code. Never checkout a PR with write scope.
name: SRW CI Evidence Link Reporter
on:
  workflow_run:
    workflows:
      - SRW Source Gate
      - SRW Chromium Business Acceptance
      - SRW Governance Contract
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: srw-ci-evidence-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ONLY trusted main (never PR code)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Update the exact-HEAD evidence link comment
        uses: actions/github-script@v7
        with:
          script: |
            const { runReporter } = require('./scripts/ci_evidence_comment.cjs');
            await runReporter({github, context, core});
