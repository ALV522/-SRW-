name: SRW Chromium Business Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: srw-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-acceptance:
    name: chromium-real-browser-ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install source and pinned browser-test requirements
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install playwright==1.56.0
      - name: Install Chromium headless browser and Linux dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run real-browser recruitment workflow acceptance
        shell: bash
        env:
          PYTHONPATH: backend
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          mkdir -p artifacts/browser
          python -m unittest discover -s browser_acceptance -p 'test_*.py' -v 2>&1 | tee artifacts/browser/browser-e2e.log
      - name: Upload source-commit browser evidence and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srw-chromium-${{ github.sha }}
          path: artifacts/browser/
          if-no-files-found: warn
