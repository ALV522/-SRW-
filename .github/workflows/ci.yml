name: SRW Source Gate

on:
  push:
    branches: [main, "dev/**", "fix/**"]
  pull_request:
    branches: [main, "dev/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    name: source-gate (${{ matrix.os }}, py3.12)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install source-test dependencies
        run: python -m pip install --upgrade pip -r requirements-ci.txt

      - name: Verify release-truth binding
        run: python scripts/check_release_truth.py

      - name: Run capability-recovery source gate
        env:
          PYTHONPATH: backend
          SRW_TEST_RESOURCE_STRICT: "1"
        run: python scripts/run_convergence_verification.py
