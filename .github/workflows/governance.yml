name: SRW Governance Contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  governance-contract:
    name: governance-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify version and mandatory governance contract
        run: python scripts/check_governance_contract.py
      - name: Require PR reading and acceptance attestation
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/check_governance_contract.py --check-pr-body
  main-push-route-audit:
    name: audit-main-commit-associated-with-PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Detect direct main pushes (retrospective only)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner,repo}=context.repo;
            const sha=context.sha;
            const {data}=await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,repo,commit_sha:sha,per_page:100
            });
            const merged=data.some(pr=>pr.merged_at && pr.base.ref === 'main');
            if (!merged) {
              core.setFailed('DIRECT_MAIN_PUSH_DETECTED: commit has no merged PR association. Audit only, not branch protection.');
            } else {
              core.info('main head is associated with merged PR: '+sha);
            }
