name: Apply Convergence 09 staged patch

on:
  push:
    branches:
      - dev/convergence09
    paths:
      - "_bootstrap/c09/READY"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/convergence09
          fetch-depth: 0

      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat _bootstrap/c09/part-* > /tmp/convergence09.patch
          git apply --check -p1 /tmp/convergence09.patch

      - name: Apply Convergence 09
        shell: bash
        run: |
          set -euo pipefail
          git apply -p1 /tmp/convergence09.patch
          rm -rf _bootstrap/c09
          rm -f .github/workflows/_apply-convergence09.yml

      - name: Commit branch changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Convergence 09: restore system and release integrity gates"
          git push origin HEAD:dev/convergence09
